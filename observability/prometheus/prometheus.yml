global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---- 依你的環境修改下列 targets ----
  # 主機指標（每台機器安裝 node_exporter），用 labels 標上 service 對應 topology.yaml 的 id
  # - job_name: node
  #   static_configs:
  #     - targets: ["10.0.1.10:9100"]
  #       labels: { service: payment-api }
  #     - targets: ["10.0.1.30:9100"]
  #       labels: { service: proxy }

  # - job_name: nginx
  #   static_configs:
  #     - targets: ["10.0.1.5:9113"]          # nginx-prometheus-exporter

  # - job_name: mysqld
  #   static_configs:
  #     - targets: ["10.0.1.40:9104"]         # mysqld_exporter

  # - job_name: redis
  #   static_configs:
